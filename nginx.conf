server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    server_tokens off;
    autoindex off;

    # Note: nginx does not inherit server-level add_header into location blocks
    # that define their own add_header — the asset location below re-declares
    # these so cached responses keep the security headers.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # No content-hashed filenames, so avoid long/immutable caching for code.
    # Artwork is generated from the pinned archive and may keep a filename
    # across builds — 7d without immutable lets updated assets refresh.
    location ~* \.(webp|png|jpg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ~* \.(css|js|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
